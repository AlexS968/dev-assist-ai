spring:
  autoconfigure:
    # Use the low-level Ollama API to preserve nullable usage and avoid model retries/pulls.
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
  application:
    name: dev-assist-ai

  ai:
    model:
      chat: ${app.ai.provider}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY}
      max-retries: 0
      timeout: ${app.ai.timeout}
      chat:
        model: ${app.ai.openai-model}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dev_assist}
    username: ${DB_USERNAME:dev_assist}
    password: ${DB_PASSWORD:dev_assist}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  ai:
    provider: ${AI_PROVIDER:openai}
    openai-model: ${OPENAI_MODEL:gpt-6-luna}
    ollama-model: ${OLLAMA_MODEL:qwen3:14b}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    prompt-version: ${AI_PROMPT_VERSION:incident-analysis-v1}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:450}
    timeout: ${AI_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
