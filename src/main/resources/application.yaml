spring:
  autoconfigure:
    # Use the low-level Ollama API to preserve nullable usage and avoid model retries/pulls.
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
  application:
    name: dev-assist-ai

  ai:
    model:
      chat: ${app.ai.provider}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY}
      max-retries: 0
      timeout: ${app.ai.timeout}
      chat:
        model: ${app.ai.openai-model}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dev_assist}
    username: ${DB_USERNAME:dev_assist}
    password: ${DB_PASSWORD:dev_assist}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  rag:
    enabled: ${RAG_ENABLED:false}
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:openai}
      openai-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      ollama-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
      timeout: ${RAG_EMBEDDING_TIMEOUT:20s}
      batch-size: ${RAG_EMBEDDING_BATCH_SIZE:32}
      max-chunks-per-run: ${RAG_EMBEDDING_MAX_CHUNKS_PER_RUN:500}
    chunking:
      max-chars: ${RAG_CHUNK_MAX_CHARS:1500}
      overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:200}
  ai:
    provider: ${AI_PROVIDER:openai}
    openai-model: ${OPENAI_MODEL:gpt-6-luna}
    ollama-model: ${OLLAMA_MODEL:qwen3:14b}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    prompt-version: ${AI_PROMPT_VERSION:incident-analysis-v2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1000}
    timeout: ${AI_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
