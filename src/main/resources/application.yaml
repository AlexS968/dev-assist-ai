spring:
  application:
    name: dev-assist-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dev_assist}
    username: ${DB_USERNAME:dev_assist}
    password: ${DB_PASSWORD:dev_assist}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info