spring:
  application:
    name: dev-assist-ai

  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY}
      max-retries: 0
      timeout: ${app.ai.timeout}
      chat:
        model: ${app.ai.model}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dev_assist}
    username: ${DB_USERNAME:dev_assist}
    password: ${DB_PASSWORD:dev_assist}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  ai:
    model: ${OPENAI_MODEL:gpt-6-luna}
    prompt-version: ${AI_PROMPT_VERSION:incident-analysis-v1}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:450}
    timeout: ${AI_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
