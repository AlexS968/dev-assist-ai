services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dev_assist
      POSTGRES_USER: dev_assist
      POSTGRES_PASSWORD: dev_assist
    ports:
      - "5432:5432"
    volumes:
      - dev-assist-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_assist -d dev_assist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-assist-postgres: